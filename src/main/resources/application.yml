spring:
  application:
    name: printing-service
  profiles:
    default: dev
  jpa:
    open-in-view: false

printing:
  web:
    allowed-origin: ${FRONTEND_ALLOWED_ORIGIN:http://localhost:5173}
  queue:
    enabled: ${PRINT_QUEUE_ENABLED:true}
    poll-delay: ${PRINT_QUEUE_POLL_DELAY_MS:2000}
    recovery-delay: ${PRINT_QUEUE_RECOVERY_DELAY_MS:60000}
    processing-timeout: ${PRINT_QUEUE_PROCESSING_TIMEOUT:PT2M}
    base-retry-delay: ${PRINT_QUEUE_BASE_RETRY_DELAY:PT10S}
    batch-size: ${PRINT_QUEUE_BATCH_SIZE:5}
  adapters:
    label-mode: ${FAKE_LABEL_MODE:SUCCESS}
    document-mode: ${FAKE_DOCUMENT_MODE:SUCCESS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
